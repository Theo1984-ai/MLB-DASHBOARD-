name: NHL Team Totals Snapshot (7 AM + 12 PM ET)

on:
  schedule:
    # Same schedule as MLB team-totals-hourly.yml.
    # NHL lines are posted day-of, so 7 AM captures opening, 12 PM captures
    # pre-game state before evening pucks drop.
    #
    # Cron is UTC. During EDT (Mar-Nov):
    #   7 AM ET  = 11:00 UTC
    #  12 PM ET  = 16:00 UTC
    # During EST (Nov-Mar, most of NHL regular season):
    #   7 AM ET  = 12:00 UTC
    #  12 PM ET  = 17:00 UTC
    - cron: '0 11 * * *'   # 7 AM ET (EDT) — opening
    - cron: '5 11 * * *'   # 7:05 AM ET (EDT) — backup
    - cron: '0 12 * * *'   # 7 AM ET (EST) — opening
    - cron: '5 12 * * *'   # 7:05 AM ET (EST) — backup
    - cron: '0 16 * * *'   # 12 PM ET (EDT) — pre-game
    - cron: '5 16 * * *'   # 12:05 PM ET (EDT) — backup
    - cron: '0 17 * * *'   # 12 PM ET (EST) — pre-game
    - cron: '5 17 * * *'   # 12:05 PM ET (EST) — backup
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure git
        run: |
          git config user.name "NHL Team Totals Bot"
          git config user.email "bot@noreply.github.com"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install tzdata

      - name: Run NHL team totals snapshot
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          GITHUB_ACTIONS: 'true'
        run: |
          python scripts/nhl_team_totals_snapshot.py

      - name: Commit + push
        run: |
          git add nhl_team_totals_history/
          if git diff --staged --quiet; then
            echo "No changes to commit (freshness guard skipped or no change)"
          else
            git commit -m "NHL team totals snapshot $(TZ='America/New_York' date '+%Y-%m-%d %I:%M %p ET')"
            for i in 1 2 3; do
              git pull --rebase -X theirs origin main && git push origin main && break
              echo "Push attempt $i failed, retrying..."
              sleep 5
            done
          fi

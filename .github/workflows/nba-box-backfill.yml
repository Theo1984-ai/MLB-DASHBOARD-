name: NBA box score backfill (one-off)

# Run by hand from the Actions tab. Saves every finished NBA game's box score (minutes, points, threes made and
# attempted per player) since the season opener to best_plays_log/nba_box/, so we can test whether a player's real
# three-point attempts per game make the threes Over rule more accurate.
on:
  workflow_dispatch:

jobs:
  backfill:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install tzdata
      - name: Backfill
        run: python -m scripts.nba_box_backfill
      - name: Commit + push
        run: |
          git config user.name "NBA Box Bot"
          git config user.email "bot@noreply.github.com"
          git add best_plays_log/nba_box/
          if git diff --staged --quiet; then
            echo "Nothing new to save"
          else
            git commit -m "NBA box score backfill"
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break || sleep 5
            done
          fi

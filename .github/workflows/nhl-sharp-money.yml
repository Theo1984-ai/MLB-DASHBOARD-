name: NHL Sharp Money Snapshot (3x daily)

on:
  schedule:
    # Same 3x-daily schedule as MLB sharp-money.yml.
    # NHL games are typically evening (7 PM ET+), so morning scans catch
    # early Polymarket book positioning before lines firm up.
    #
    # Cron is UTC. During EDT (Mar-Nov):
    #   7 AM ET  = 11:00 UTC
    #  11 AM ET  = 15:00 UTC
    #   1 PM ET  = 17:00 UTC
    # During EST (Nov-Mar, most of NHL regular season):
    #   7 AM ET  = 12:00 UTC
    #  11 AM ET  = 16:00 UTC
    #   1 PM ET  = 18:00 UTC
    - cron: '0 11 * * *'   # 7 AM ET (EDT)
    - cron: '5 11 * * *'   # 7:05 AM ET (EDT) — backup
    - cron: '0 12 * * *'   # 7 AM ET (EST)
    - cron: '5 12 * * *'   # 7:05 AM ET (EST) — backup
    - cron: '0 15 * * *'   # 11 AM ET (EDT)
    - cron: '5 15 * * *'   # 11:05 AM ET (EDT) — backup
    - cron: '0 16 * * *'   # 11 AM ET (EST)
    - cron: '5 16 * * *'   # 11:05 AM ET (EST) — backup
    - cron: '0 17 * * *'   # 1 PM ET (EDT)
    - cron: '5 17 * * *'   # 1:05 PM ET (EDT) — backup
    - cron: '0 18 * * *'   # 1 PM ET (EST)
    - cron: '5 18 * * *'   # 1:05 PM ET (EST) — backup
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure git
        run: |
          git config user.name "NHL Sharp Money Bot"
          git config user.email "bot@noreply.github.com"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install tzdata

      - name: Run NHL sharp money snapshot
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          GITHUB_ACTIONS: 'true'
        run: |
          python scripts/nhl_sharp_money_snapshot.py

      - name: Commit + push
        run: |
          git add nhl_sharp_money_history/
          if git diff --staged --quiet; then
            echo "No changes to commit (no new picks or unchanged)"
          else
            git commit -m "NHL sharp money snapshot $(TZ='America/New_York' date '+%Y-%m-%d %I:%M %p ET')"
            for i in 1 2 3; do
              git pull --rebase -X theirs origin main && git push origin main && break
              echo "Push attempt $i failed, retrying..."
              sleep 5
            done
          fi

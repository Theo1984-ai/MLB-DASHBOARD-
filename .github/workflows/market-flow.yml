name: Market flow report

# Runs every 30 minutes from about 10 AM to midnight ET (so the Market Flow page stays fresh) and can be run by hand from the
# Actions tab. Reads Polymarket's trades for each game's moneyline, spread and total and prints, per side,
# cash %, orders %, delta, average order and top-wallet share (like the Discord market-flow post). Saves each run to
# best_plays_log/market_flow/<date>/. Polymarket is reachable from Actions, not from the cloud sandbox.
on:
  schedule:
    - cron: '7,37 15-23,0-4 * * *'    # UTC: 10 AM to 11:37 PM ET in winter (11 AM to 12:37 AM in summer)
  workflow_dispatch:
    inputs:
      sport:
        description: "Sport (ALL, NFL, NBA, NHL, CFB, NCAAB or MLB), or DISCOVER to list Polymarket tag names"
        default: "ALL"

jobs:
  flow:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install tzdata
      - name: Market flow
        run: python -m scripts.market_flow "${{ github.event.inputs.sport || 'ALL' }}"
      - name: Track the playable sides (record new ones, grade finished games)
        run: python -m scripts.market_flow_tracker
      - name: Commit + push
        run: |
          git config user.name "Market Flow Bot"
          git config user.email "bot@noreply.github.com"
          git add best_plays_log/market_flow/ best_plays_log/market_flow_plays/
          if git diff --staged --quiet; then
            echo "Nothing to save"
          else
            git commit -m "Market flow report"
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break || sleep 5
            done
          fi

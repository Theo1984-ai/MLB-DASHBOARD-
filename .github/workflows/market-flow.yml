name: Market flow report (hand-run)

# Run by hand from the Actions tab. Reads Polymarket's trades for each game's moneyline, spread and total and prints, per side,
# cash %, orders %, delta, average order and top-wallet share (like the Discord market-flow post). Saves each run to
# best_plays_log/market_flow/<date>/. Polymarket is reachable from Actions, not from the cloud sandbox.
on:
  workflow_dispatch:
    inputs:
      sport:
        description: "Sport (NFL, NBA, NHL or CFB)"
        default: "NFL"

jobs:
  flow:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install tzdata
      - name: Market flow
        run: python -m scripts.market_flow "${{ github.event.inputs.sport || 'NFL' }}"
      - name: Commit + push
        run: |
          git config user.name "Market Flow Bot"
          git config user.email "bot@noreply.github.com"
          git add best_plays_log/market_flow/
          if git diff --staged --quiet; then
            echo "Nothing to save"
          else
            git commit -m "Market flow report"
            for i in 1 2 3; do
              git pull --rebase origin main && git push origin HEAD:main && break || sleep 5
            done
          fi

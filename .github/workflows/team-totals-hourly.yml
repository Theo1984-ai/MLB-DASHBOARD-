name: Team Totals Snapshot (11 PM + 12 PM ET)

on:
  schedule:
    # ONLY 2 scheduled fires per day (user changed from hourly on 7/20):
    #  11 PM ET — opening lines for next day's games
    #  12 PM ET — pre-first-pitch check on same games
    #
    # Cron is UTC. During EDT (Mar-Nov, most of MLB season):
    #   11 PM ET = 03:00 UTC (next day)
    #   12 PM ET = 16:00 UTC
    # We add a 5-min backup entry for each (GitHub Actions is unreliable
    # and can delay/skip crons; the script's freshness guard will skip
    # backup runs if the primary already succeeded).
    - cron: '0 3 * * *'    # 11 PM ET (EDT) — primary
    - cron: '5 3 * * *'    # 11:05 PM ET (EDT) — backup
    - cron: '0 16 * * *'   # 12 PM ET (EDT) — primary
    - cron: '5 16 * * *'   # 12:05 PM ET (EDT) — backup
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure git
        run: |
          git config user.name "Team Totals Bot"
          git config user.email "bot@noreply.github.com"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install tzdata

      - name: Run team totals snapshot
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          GITHUB_ACTIONS: 'true'
        run: |
          python scripts/team_totals_snapshot.py

      - name: Commit + push
        run: |
          git add team_totals_history/
          if git diff --staged --quiet; then
            echo "No changes to commit (freshness guard skipped or no change)"
          else
            git commit -m "Team totals snapshot $(TZ='America/New_York' date '+%Y-%m-%d %I:%M %p ET')"
            for i in 1 2 3; do
              git pull --rebase -X theirs origin main && git push origin main && break
              echo "Push attempt $i failed, retrying..."
              sleep 5
            done
          fi

name: Team Totals Snapshot (7 AM + 12 PM ET)

on:
  schedule:
    # 2 scheduled fires per day (user changed from 11 PM to 7 AM on 7/21):
    #  7 AM ET  — opening snapshot (DK usually has lines by this time)
    #  12 PM ET — pre-first-pitch check
    #
    # Cron is UTC. During EDT (Mar-Nov, most of MLB season):
    #   7 AM ET  = 11:00 UTC
    #   12 PM ET = 16:00 UTC
    # 5-min backup entries; the script's freshness guard skips backup
    # runs if the primary already succeeded.
    - cron: '0 11 * * *'   # 7 AM ET (EDT) — primary
    - cron: '5 11 * * *'   # 7:05 AM ET (EDT) — backup
    - cron: '0 16 * * *'   # 12 PM ET (EDT) — primary
    - cron: '5 16 * * *'   # 12:05 PM ET (EDT) — backup
  workflow_dispatch:

jobs:
  # Switched on/off from the Automation page (automation_config.json). Missing = on.
  gate:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: automation_config.json
          sparse-checkout-cone-mode: false
      - id: check
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          cfg = json.load(open("automation_config.json")) if os.path.exists("automation_config.json") else {}
          print("enabled=" + ("false" if cfg.get("jobs", {}).get("team_totals") is False else "true"))
          PY

  snapshot:
    needs: gate
    if: github.event_name == 'workflow_dispatch' || needs.gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure git
        run: |
          git config user.name "Team Totals Bot"
          git config user.email "bot@noreply.github.com"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install tzdata

      - name: Run team totals snapshot
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          GITHUB_ACTIONS: 'true'
        run: |
          python scripts/team_totals_snapshot.py

      - name: Commit + push
        run: |
          git add team_totals_history/
          if git diff --staged --quiet; then
            echo "No changes to commit (freshness guard skipped or no change)"
          else
            git commit -m "Team totals snapshot $(TZ='America/New_York' date '+%Y-%m-%d %I:%M %p ET')"
            for i in 1 2 3; do
              git pull --rebase -X theirs origin main && git push origin main && break
              echo "Push attempt $i failed, retrying..."
              sleep 5
            done
          fi

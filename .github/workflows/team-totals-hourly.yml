name: Team Totals Hourly Snapshot

on:
  schedule:
    # Hourly snapshots 11 AM through 10 PM ET.
    # Cron is UTC. During EDT (Mar-Nov, most of MLB season): ET+4 = UTC.
    # During EST (Nov-Mar, offseason): ET+5 = UTC. We schedule for EDT
    # since that covers the entire regular season.
    #
    # 11 AM ET = 15:00 UTC
    # 12 PM ET = 16:00 UTC
    # ...
    # 10 PM ET = 02:00 UTC (next day)
    - cron: '0 15 * * *'   # 11 AM ET (EDT)
    - cron: '0 16 * * *'   # 12 PM ET
    - cron: '0 17 * * *'   # 1 PM ET
    - cron: '0 18 * * *'   # 2 PM ET
    - cron: '0 19 * * *'   # 3 PM ET
    - cron: '0 20 * * *'   # 4 PM ET
    - cron: '0 21 * * *'   # 5 PM ET
    - cron: '0 22 * * *'   # 6 PM ET
    - cron: '0 23 * * *'   # 7 PM ET
    - cron: '0 0 * * *'    # 8 PM ET
    - cron: '0 1 * * *'    # 9 PM ET
    - cron: '0 2 * * *'    # 10 PM ET
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure git
        run: |
          git config user.name "Team Totals Bot"
          git config user.email "bot@noreply.github.com"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install tzdata

      - name: Run team totals snapshot
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          GITHUB_ACTIONS: 'true'
        run: |
          python scripts/team_totals_snapshot.py

      - name: Commit + push
        run: |
          git add team_totals_history/
          if git diff --staged --quiet; then
            echo "No changes to commit (snapshot unchanged?)"
          else
            git commit -m "Team totals snapshot $(TZ='America/New_York' date '+%Y-%m-%d %I:%M %p ET')"
            for i in 1 2 3; do
              git pull --rebase -X theirs origin main && git push origin main && break
              echo "Push attempt $i failed, retrying..."
              sleep 5
            done
          fi

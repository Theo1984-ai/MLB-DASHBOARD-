name: NHL shooting backfill (one-off)

# Run by hand from the Actions tab. Saves every finished NHL game's box score (shots and goals per player) since the
# season opener to best_plays_log/nhl_shooting/, so the goals tracker has each player's shooting percentage.
on:
  workflow_dispatch:

jobs:
  backfill:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install tzdata
      - name: Backfill
        run: python -m scripts.nhl_shooting_backfill
      - name: Commit + push
        run: |
          git config user.name "NHL Shooting Bot"
          git config user.email "bot@noreply.github.com"
          git add best_plays_log/nhl_shooting/
          if git diff --staged --quiet; then
            echo "Nothing new to save"
          else
            git commit -m "NHL shooting data backfill"
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break || sleep 5
            done
          fi

name: Polymarket player props probe (one-off)

# Run by hand from the Actions tab. Lists the player props Polymarket carries, saves them to best_plays_log/polymarket_props/,
# and compares any that match a Pinnacle line in our newest props snapshot.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install tzdata
      - name: Probe
        run: python -m scripts.polymarket_props_probe
      - name: Commit + push
        run: |
          git config user.name "Polymarket Probe Bot"
          git config user.email "bot@noreply.github.com"
          git add best_plays_log/polymarket_props/
          if git diff --staged --quiet; then
            echo "Nothing to save"
          else
            git commit -m "Polymarket player props probe"
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break || sleep 5
            done
          fi

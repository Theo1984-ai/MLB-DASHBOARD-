name: Daily Picks Auto-Update

on:
  # DISABLED 2026-08-27 — API downgraded to 20k/mo. All automated scans
  # off except team totals. Re-enable by uncommenting the schedule block
  # below when you upgrade back. workflow_dispatch stays on so you can
  # still trigger a run manually from the GitHub UI when needed.
  # schedule:
  #   - cron: '0 20 * * *'   # 4 PM ET in EDT
  #   - cron: '0 21 * * *'   # 4 PM ET in EST
  #   - cron: '0 18 * * *'   # 2 PM ET in EDT
  workflow_dispatch:        # Manual trigger only

jobs:
  update-picks:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Allow pushing to the repo

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Only install what the daily-picks script needs
          # (full requirements.txt is heavy; we keep this lean)
          pip install pandas requests

      - name: Run daily picks update
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        run: |
          python scripts/daily_picks_update.py

      - name: Commit updated picks
        run: |
          git config user.name "Daily Picks Bot"
          git config user.email "bot@noreply.github.com"
          git add tonight_picks/latest.json
          if git diff --staged --quiet; then
            echo "No changes to commit (picks unchanged)"
          else
            git commit -m "Auto-update tonight's picks $(date -u +%Y-%m-%d)"
            git push
          fi

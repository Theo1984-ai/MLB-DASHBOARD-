name: HR Line Movement Snapshot (7 AM + 12 PM ET)

on:
  # DISABLED 2026-08-27 — API downgraded to 20k/mo. All automated scans
  # off except team totals. Re-enable by uncommenting the schedule block
  # below when you upgrade back. workflow_dispatch stays on so you can
  # still trigger a run manually from the GitHub UI when needed.
  # schedule:
  #   - cron: '0 11 * * *'   # 7 AM ET primary
  #   - cron: '5 11 * * *'   # 7:05 AM ET backup
  #   - cron: '0 16 * * *'   # 12 PM ET primary
  #   - cron: '5 16 * * *'   # 12:05 PM ET backup
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure git
        run: |
          git config user.name "HR Line Bot"
          git config user.email "bot@noreply.github.com"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install tzdata

      - name: Run HR line movement snapshot
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          GITHUB_ACTIONS: 'true'
        run: |
          python scripts/hr_line_movement_snapshot.py

      - name: Commit + push
        run: |
          git add hr_line_movement/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "HR line movement snapshot $(TZ='America/New_York' date '+%Y-%m-%d %I:%M %p ET')"
            for i in 1 2 3; do
              git pull --rebase -X theirs origin main && git push origin main && break
              echo "Push attempt $i failed, retrying..."
              sleep 5
            done
          fi

name: HR Line Movement Snapshot (11 PM + 12 PM ET)

on:
  schedule:
    # Same schedule as team totals:
    #   11 PM ET (EDT) = 03:00 UTC (next day) — opening lines for next day
    #   12 PM ET (EDT) = 16:00 UTC — pre-first-pitch check
    # Backup entries 5 min later; script's freshness guard skips duplicates.
    - cron: '0 3 * * *'    # 11 PM ET primary
    - cron: '5 3 * * *'    # 11:05 PM ET backup
    - cron: '0 16 * * *'   # 12 PM ET primary
    - cron: '5 16 * * *'   # 12:05 PM ET backup
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure git
        run: |
          git config user.name "HR Line Bot"
          git config user.email "bot@noreply.github.com"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install tzdata

      - name: Run HR line movement snapshot
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          GITHUB_ACTIONS: 'true'
        run: |
          python scripts/hr_line_movement_snapshot.py

      - name: Commit + push
        run: |
          git add hr_line_movement/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "HR line movement snapshot $(TZ='America/New_York' date '+%Y-%m-%d %I:%M %p ET')"
            for i in 1 2 3; do
              git pull --rebase -X theirs origin main && git push origin main && break
              echo "Push attempt $i failed, retrying..."
              sleep 5
            done
          fi

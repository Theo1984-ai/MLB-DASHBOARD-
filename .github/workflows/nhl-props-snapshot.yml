name: NHL Props Snapshot (noon + 5 PM + 6 PM ET)

on:
  schedule:
    # NHL props are posted same-day around noon ET.
    # Snapshots at noon, 5 PM, and 6 PM ET capture opening lines,
    # afternoon movement, and final pre-game state.
    #
    # Cron is UTC. During EDT (Mar–Nov):  offset = -4h
    # During EST (Nov–Mar):               offset = -5h
    - cron: '0 16 * * *'   # noon ET (EDT)
    - cron: '0 17 * * *'   # noon ET (EST)
    - cron: '0 21 * * *'   #  5 PM ET (EDT)
    - cron: '0 22 * * *'   #  5 PM ET (EST) / 6 PM ET (EDT)
    - cron: '0 23 * * *'   #  6 PM ET (EST)
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure git
        run: |
          git config user.name "NHL Props Bot"
          git config user.email "bot@noreply.github.com"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install tzdata

      - name: Run NHL props snapshot
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          GITHUB_ACTIONS: 'true'
        run: |
          python scripts/nhl_props_snapshot.py

      - name: Commit + push
        run: |
          git add nhl_props_history/
          if git diff --staged --quiet; then
            echo "No changes to commit (freshness guard or no props yet)"
          else
            git commit -m "NHL props snapshot $(TZ='America/New_York' date '+%Y-%m-%d %I:%M %p ET')"
            for i in 1 2 3; do
              git pull --rebase -X theirs origin main && git push origin main && break
              echo "Push attempt $i failed, retrying..."
              sleep 5
            done
          fi

name: NFL Line Alert Snapshot

on:
  schedule:
    - cron: '0 17 * * *'   # noon ET
    - cron: '0 21 * * *'   # 4 PM ET
    - cron: '0 23 * * *'   # 6 PM ET
  workflow_dispatch:

jobs:
  # Switched on/off from the Automation page (automation_config.json). Missing = on.
  gate:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: automation_config.json
          sparse-checkout-cone-mode: false
      - id: check
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          cfg = json.load(open("automation_config.json")) if os.path.exists("automation_config.json") else {}
          print("enabled=" + ("false" if cfg.get("jobs", {}).get("nfl_line_alert") is False else "true"))
          PY

  snapshot:
    needs: gate
    if: github.event_name == 'workflow_dispatch' || needs.gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run snapshot
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        run: python scripts/line_alert_snapshot.py nfl

      - name: Commit history
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add nfl_line_alert_history/
          git diff --cached --quiet || git commit -m "NFL line alert snapshot $(date -u '+%Y-%m-%d %I:%M %p ET')"
          git push

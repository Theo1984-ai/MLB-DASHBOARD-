name: CFB Line Alert Snapshot

on:
  schedule:
    - cron: '0 17 * * *'   # noon ET
    - cron: '0 21 * * *'   # 4 PM ET
    - cron: '0 23 * * *'   # 6 PM ET
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run snapshot
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        run: python scripts/line_alert_snapshot.py cfb

      - name: Commit history
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cfb_line_alert_history/
          git diff --cached --quiet || git commit -m "CFB line alert snapshot $(date -u '+%Y-%m-%d %I:%M %p ET')"
          git push

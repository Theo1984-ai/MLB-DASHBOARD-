name: Best Plays Auto Snapshot

on:
  schedule:
    - cron: '17 * * * *'    # every hour, all day (UTC clock), off the busy top-of-hour slot
  workflow_dispatch:
    inputs:
      send_test_message:
        description: 'Only send a Telegram test message (no snapshot, no Odds API credits)'
        type: boolean
        default: false

# One run at a time so two snapshots never write the same log together.
concurrency:
  group: best-plays-auto
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Snapshot every sport, log picks and predictions, grade finished games
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TEST: ${{ github.event.inputs.send_test_message }}
        run: python scripts/best_plays_auto.py

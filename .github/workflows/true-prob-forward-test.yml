name: Daily All Tracker (cloud backup)

on:
  schedule:
    # Target: capture props by ~12 PM ET (some games start 12:10 PM ET).
    # GitHub Actions cron is unreliable — schedules routinely fire 1-6 hours
    # late under load. We spam multiple times to maximize chance of hitting
    # the noon window. daily_all.py skips re-snapshotting if today's file is
    # fresh, so extra firings only cost a cheap settle of yesterday.
    - cron: '0 15 * * *'    # 11:00 AM ET (EDT) — early bird
    - cron: '0 16 * * *'    # 12:00 PM ET (EDT) — target
    - cron: '30 16 * * *'   # 12:30 PM ET (EDT)
    - cron: '0 17 * * *'    # 1:00 PM ET (EDT) / 12:00 PM ET (EST)
    - cron: '0 18 * * *'    # 2:00 PM ET (EDT) / 1:00 PM ET (EST) — backup
    - cron: '0 19 * * *'    # 3:00 PM ET (EDT) — last chance

  workflow_dispatch:
    inputs:
      skip_hr:
        description: 'Skip HR Tracker (true/false)'
        required: false
        default: 'false'
      skip_hrr:
        description: 'Skip H+R+R Tracker (true/false)'
        required: false
        default: 'false'

jobs:
  daily-all:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure git
        run: |
          git config user.name "Daily All Bot"
          git config user.email "bot@noreply.github.com"

      - name: Install minimal dependencies
        # Don't install full requirements.txt (streamlit is 50+ MB and
        # unnecessary for the daily script). Just what daily_all.py needs.
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests certifi tzdata

      - name: Diagnose secrets + Odds API
        # Self-diagnosing step — writes status to GITHUB_STEP_SUMMARY so we
        # can see what's wrong even without log access.
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        run: |
          echo "## Pre-flight diagnostics" >> $GITHUB_STEP_SUMMARY
          python <<'PY'
          import os, urllib.request, urllib.error, json, sys
          key = os.environ.get("THE_ODDS_API_KEY", "")
          summary = []
          if not key:
              summary.append("- ❌ **THE_ODDS_API_KEY is EMPTY** — secret not configured in repo settings")
              print("FAIL: THE_ODDS_API_KEY is empty")
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
                  f.write("\n".join(summary) + "\n")
              sys.exit(1)
          summary.append(f"- ✅ Secret length: {len(key)} chars (starts {key[:3]}***, ends ***{key[-3:]})")
          # Try a real API call
          try:
              url = f"https://api.the-odds-api.com/v4/sports?apiKey={key}"
              with urllib.request.urlopen(url, timeout=10) as r:
                  data = json.loads(r.read())
              summary.append(f"- ✅ Odds API responded — {len(data)} sports listed")
              quota_used = r.headers.get("x-requests-used", "?")
              quota_left = r.headers.get("x-requests-remaining", "?")
              summary.append(f"- 📊 Quota: {quota_used} used / {quota_left} remaining")
          except urllib.error.HTTPError as e:
              summary.append(f"- ❌ Odds API HTTP {e.code}: {e.reason}")
              if e.code == 401:
                  summary.append("- 🔑 **Key is INVALID** — wrong value pasted in secret")
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
                  f.write("\n".join(summary) + "\n")
              sys.exit(1)
          except Exception as e:
              summary.append(f"- ❌ Network error: {e}")
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
                  f.write("\n".join(summary) + "\n")
              sys.exit(1)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("\n".join(summary) + "\n")
          print("OK: secrets + API working")
          PY

      - name: Run daily_all.py
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTIONS: 'true'
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.skip_hr }}" = "true" ]; then
            ARGS="$ARGS --skip-hr"
          fi
          if [ "${{ github.event.inputs.skip_hrr }}" = "true" ]; then
            ARGS="$ARGS --skip-hrr"
          fi
          python daily_all.py $ARGS

      - name: Commit + push history files
        run: |
          git add true_prob_history/ soft_scanner_history/ hr_tracker/ hrr_tracker/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Daily forward-test $(date -u +%Y-%m-%d)"
            for i in 1 2 3; do
              git pull --rebase origin main && git push origin main && break
              echo "Push attempt $i failed, retrying..."
              sleep 5
            done
          fi

name: Daily All Tracker (cloud backup)

on:
  schedule:
    - cron: '30 19 * * *'   # 3:30 PM ET in EDT (summer)
    - cron: '30 20 * * *'   # 3:30 PM ET in EST (winter)

  workflow_dispatch:
    inputs:
      skip_hr:
        description: 'Skip HR Tracker (true/false)'
        required: false
        default: 'false'
      skip_hrr:
        description: 'Skip H+R+R Tracker (true/false)'
        required: false
        default: 'false'

jobs:
  daily-all:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure git
        run: |
          git config user.name "Daily All Bot"
          git config user.email "bot@noreply.github.com"

      - name: Install minimal dependencies
        # Don't install full requirements.txt (streamlit is 50+ MB and
        # unnecessary for the daily script). Just what daily_all.py needs.
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests certifi tzdata

      - name: Run daily_all.py
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTIONS: 'true'
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.skip_hr }}" = "true" ]; then
            ARGS="$ARGS --skip-hr"
          fi
          if [ "${{ github.event.inputs.skip_hrr }}" = "true" ]; then
            ARGS="$ARGS --skip-hrr"
          fi
          python daily_all.py $ARGS

      - name: Commit + push true_prob_history
        run: |
          git add true_prob_history/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "True Prob daily $(date -u +%Y-%m-%d)"
            for i in 1 2 3; do
              git pull --rebase origin main && git push origin main && break
              echo "Push attempt $i failed, retrying..."
              sleep 5
            done
          fi

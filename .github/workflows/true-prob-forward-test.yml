name: Daily All Tracker (cloud backup)

on:
  schedule:
    # Daily 3:30 PM ET (one shot: settle yesterday + snapshot today + HR/H+R+R save)
    # Note: GitHub Actions cron times are UTC and may run 5-30 min late.
    - cron: '30 19 * * *'   # 3:30 PM ET in EDT (summer)
    - cron: '30 20 * * *'   # 3:30 PM ET in EST (winter)

  workflow_dispatch:
    inputs:
      skip_hr:
        description: 'Skip HR Tracker (true/false)'
        required: false
        default: 'false'
      skip_hrr:
        description: 'Skip H+R+R Tracker (true/false)'
        required: false
        default: 'false'

jobs:
  daily-all:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily_all.py
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.skip_hr }}" = "true" ]; then
            ARGS="$ARGS --skip-hr"
          fi
          if [ "${{ github.event.inputs.skip_hrr }}" = "true" ]; then
            ARGS="$ARGS --skip-hrr"
          fi
          python daily_all.py $ARGS

      - name: Commit any local file changes (true_prob_history)
        # daily_all.py already pushed via git push origin main, but if there
        # were rebase conflicts we want to retry here as backup.
        run: |
          git config user.name "Daily All Bot"
          git config user.email "bot@noreply.github.com"
          git add true_prob_history/
          if git diff --staged --quiet; then
            echo "No remaining changes to commit (daily_all.py already pushed)"
          else
            git commit -m "True Prob backup commit $(date -u +%Y-%m-%d-%H%M)"
            for i in 1 2 3; do
              git pull --rebase origin main && git push origin main && break
              echo "Push attempt $i failed, retrying..."
              sleep 5
            done
          fi
